name: Deploy Frontend to S3 + CloudFront (OIDC)

on:
  push:
    branches: [ master ]
    paths:
      - 'FE/**'

permissions:
  id-token: write      # Bắt buộc để request token OIDC từ GitHub
  contents: read       # Bắt buộc để checkout code

env:
  AWS_REGION: ap-southeast-1  # Sửa lại vùng AWS tương ứng của bạn nếu khác
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_ARN }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'FE/package-lock.json'

      - name: Install dependencies
        run: |
          cd FE
          npm ci

      - name: Build frontend
        env:
          VITE_SERVER_BACKEND: /api/v1
          VITE_QUIZ_FLASH_API_URL: https://duckq1-n8n.duckdns.org/webhook/970e5eb7-c672-475e-9e8c-5e49967d2718/learning
          VITE_CHAT_RAG_API_URL: https://duckq1-n8n.duckdns.org/webhook/f75be7aa-52f0-496d-b8d6-31a1ec1afaaa/chat-with-rag/
          VITE_OUTLINE_API_URL: https://duckq1-n8n.duckdns.org/webhook/970e5eb7-c672-475e-9e8c-5e49967d2718/outline
        run: |
          cd FE
          npm run build

      - name: Configure AWS credentials (via OIDC Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsFrontendDeploy

      - name: Deploy to S3 Bucket
        run: |
          aws s3 sync FE/dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
